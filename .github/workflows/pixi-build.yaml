---
name: Pixi Build

# Builds a subset of the ROS 2 workspace in the pixi environment described by
# pixi.toml.  This is not a replacement for ci.ros2.org -- it is a fast signal
# on whether a change to pixi.toml or ros2.repos still yields an environment
# that can actually build ROS 2, on both of the platforms pixi.toml targets.
#
# Standard GitHub-hosted runners have 4 vCPUs, 16 GB of RAM and 14 GB of disk,
# which is not enough for the whole workspace, hence --packages-up-to.  The set
# can be overridden when the workflow is dispatched manually.

on:
  pull_request:
    paths:
      - 'pixi.toml'
      - 'ros2.repos'
      - '.github/workflows/pixi-build.yaml'
  workflow_dispatch:
    inputs:
      packages-up-to:
        description: 'Space separated packages to build up to'
        type: string
        default: 'demo_nodes_cpp demo_nodes_py rosbag2'
      run-tests:
        description: 'Run colcon test after building'
        type: boolean
        default: false
  schedule:
    # Daily, to catch conda-forge drift in the loosely pinned dependencies.
    - cron: '0 7 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: ${{ matrix.name }}
    # Only this repository has a reason to run the nightly.
    if: github.event_name != 'schedule' || github.repository == 'ros2/ros2'
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: 350
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            packages-skip: ''
            # GitHub's Ubuntu runners ship PowerShell, and colcon-powershell
            # (PRIORITY 300) then outranks colcon-core's sh extension
            # (PRIORITY 200) as the primary shell.  Its environment hooks
            # hardcode a backslash separator, so PYTHONPATH is emitted as
            # 'install\lib/python3.12/site-packages' and nothing downstream
            # of a Python package can be imported.
            extension-blocklist: colcon_core.shell.powershell
            workdir: '.'
            parallel-workers: '4'
          # Ubuntu arm64 is Tier 1 in REP 2000.  These runners are free and
          # unlimited on public repositories, same as the amd64 ones.
          - name: linux-arm64
            os: ubuntu-24.04-arm
            packages-skip: ''
            extension-blocklist: colcon_core.shell.powershell
            workdir: '.'
            parallel-workers: '4'
          # The tracetools packages are LTTng based and are not built on Windows.
          - name: windows
            os: windows-latest
            packages-skip: >-
              --packages-skip lttngpy tracetools_trace ros2trace
              tracetools_launch test_ros2trace test_tracetools
              test_tracetools_launch tracetools_test
            extension-blocklist: ''
            workdir: 'W:\'
            parallel-workers: '4'
          # macOS is Tier 3 in REP 2000, and these runners are 3 vCPUs and
          # 7 GB of RAM -- half the memory of the others -- so keep colcon's
          # own concurrency down to leave room for the compilers.  The
          # tracetools packages are LTTng based and do not build here either.
          - name: macos
            os: macos-latest
            experimental: true
            packages-skip: >-
              --packages-skip lttngpy tracetools_trace ros2trace
              tracetools_launch test_ros2trace test_tracetools
              test_tracetools_launch tracetools_test
            extension-blocklist: colcon_core.shell.powershell
            workdir: '.'
            parallel-workers: '2'
    env:
      PACKAGES: ${{ inputs.packages-up-to || 'demo_nodes_cpp demo_nodes_py rosbag2' }}
      PACKAGES_SKIP: ${{ matrix.packages-skip }}
      COLCON_EXTENSION_BLOCKLIST: ${{ matrix.extension-blocklist }}
      # CMAKE_<LANG>_COMPILER_LAUNCHER only reaches the C and C++ compilers.
      # zenoh_cpp_vendor builds several hundred Rust crates through cargo,
      # which was 26 minutes of the Windows build and two thirds of a warm
      # Linux one, so wrap rustc too.  sccache refuses to cache incremental
      # compilation, hence CARGO_INCREMENTAL.
      # Passed as environment rather than -D on purpose: CMake initialises
      # CMAKE_<LANG>_COMPILER_LAUNCHER from the environment variable of the
      # same name, so this also reaches the nested configures that
      # ExternalProject_Add and ament_vendor run.  ament_vendor forwards 22
      # variables to its sub-builds and the launchers are not among them,
      # so with -D alone every vendor package compiles uncached.
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: '0'
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      # Well under the 10 GB that GitHub allows a repository to cache in total.
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - name: Clone project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build from a substituted drive so that every absolute path baked into
      # the build -- and so into sccache's hashes -- is the same here as it is
      # on a developer's machine, instead of depending on where the runner
      # happened to check the workspace out.  It also buys back the thirteen
      # characters of MAX_PATH that 'D:\a\ros2\ros2' costs over 'W:'.
      - name: Map the workspace onto a substituted drive
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist W:\ subst W: "%GITHUB_WORKSPACE%"
          dir W:\

      # ament and rosidl generate deeply nested paths that overrun MAX_PATH.
      # The ros2/ci Windows images do the same thing.
      - name: Enable long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name 'LongPathsEnabled' -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      # Ninja needs cl.exe on the PATH.  The Visual Studio generator is not an
      # option here: CMake only honours <LANG>_COMPILER_LAUNCHER, and therefore
      # sccache, for the Ninja and Makefile generators.
      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # Defender scans every object file, library and Rust rlib as it is
      # written, which is a lot of synchronous I/O across a build of this
      # shape.  The runner is ephemeral and builds only what this workflow
      # checked out, so exclude the workspace.
      - name: Exclude the workspace from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath '${{ github.workspace }}' -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath 'W:' -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess 'cl.exe','link.exe','rustc.exe','sccache.exe' -ErrorAction SilentlyContinue

      - name: Install pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          # pixi.lock is not committed, so there is no stable key to cache the
          # environment against.  It is installed explicitly below instead.
          run-install: false
          cache: false

      # The compiler cache is the only thing worth carrying between runs.  The
      # package downloads would cost more disk than they save wall clock, and
      # disk is the binding constraint on these runners.
      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ matrix.name }}-

      - name: Install the pixi environment
        working-directory: ${{ matrix.workdir }}
        run: pixi install --color never

      # Two copies of GNU coreutils' link.exe end up ahead of the MSVC tools
      # on PATH: one from the pixi environment's git package, and one from the
      # runner's own Git for Windows, which lands on PATH because GitHub's
      # `bash` is Git Bash.  CMake is unaffected, since it resolves an absolute
      # CMAKE_LINKER at configure time, but cargo looks link.exe up by name and
      # zenoh_c then fails with "/usr/bin/link: extra operand".  Setting
      # CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER is not a way out: zenoh_c
      # forwards it into a nested cargo --config, where the backslashes in the
      # path are not valid TOML.  Nothing in a ROS 2 build wants coreutils'
      # link, so take both out of the way.
      - name: Disable the coreutils link.exe
        working-directory: ${{ matrix.workdir }}
        if: runner.os == 'Windows'
        shell: bash
        run: |
          disable() {
            if [ -f "$1" ]; then
              mv "$1" "$1.disabled"
              echo "Renamed $1"
            else
              echo "Not present, skipping: $1"
            fi
          }
          disable '.pixi/envs/default/Library/usr/bin/link.exe'
          disable '/c/Program Files/Git/usr/bin/link.exe'
          echo "link.exe now resolves to: $(command -v link.exe || echo 'nothing')"

      - name: Import the ROS 2 sources
        working-directory: ${{ matrix.workdir }}
        shell: bash
        run: |
          mkdir -p src
          pixi run vcs import --input ros2.repos --shallow --workers 8 src

      - name: Report available disk space
        working-directory: ${{ matrix.workdir }}
        shell: bash
        run: df -h .

      - name: Build
        working-directory: ${{ matrix.workdir }}
        shell: bash
        run: |
          pixi run colcon build \
            --merge-install \
            --parallel-workers ${{ matrix.parallel-workers }} \
            --event-handlers console_cohesion+ \
            --packages-up-to $PACKAGES \
            $PACKAGES_SKIP \
            --cmake-args \
              -GNinja \
              --no-warn-unused-cli \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_BUILD_WITH_INSTALL_RPATH:bool=TRUE \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DSTACK_DETAILS_AUTO_DETECT:bool=FALSE \
              -DSTACK_DETAILS_BFD:bool=FALSE \
              -Wno-deprecated

      - name: Test
        working-directory: ${{ matrix.workdir }}
        if: inputs.run-tests
        shell: bash
        run: |
          pixi run colcon test \
            --merge-install \
            --event-handlers console_cohesion+ \
            --packages-up-to $PACKAGES \
            $PACKAGES_SKIP
          pixi run colcon test-result --verbose

      - name: Report compiler cache statistics
        working-directory: ${{ matrix.workdir }}
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          pixi run sccache --show-stats
          # Flush the server so the cache directory is consistent when the
          # post-run cache step picks it up.
          pixi run sccache --stop-server

      # actions/cache only saves the cache when the job succeeds, and a build
      # that fell over partway through has still done real work worth keeping
      # for the next attempt, so save it explicitly instead.
      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ matrix.name }}-${{ github.run_id }}

      - name: Upload colcon logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colcon-logs-${{ matrix.name }}
          path: log/
          retention-days: 7
          if-no-files-found: ignore
