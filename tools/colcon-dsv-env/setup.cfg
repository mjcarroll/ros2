[metadata]
name = colcon-dsv-env
version = 0.1.0
description = Derive the colcon command environment from .dsv descriptors instead of spawning a shell
license = Apache License, Version 2.0

[options]
python_requires = >=3.6
install_requires =
    colcon-core>=0.17.0
packages = find:
zip_safe = true

[options.entry_points]
colcon_core.shell =
    dsv_env = colcon_dsv_env.shell.dsv_env:DsvEnvShell

[options.packages.find]
exclude = test
